<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hmharness 桥接 · 侧栏</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="chat-layout">
  <h1><span class="logo"></span>hmharness 浏览器助手</h1>

  <div class="status"><span class="dot" id="dot"></span><span class="txt" id="status-txt">读取状态…</span></div>

  <div id="chat" aria-live="polite"></div>

  <div class="row composer">
    <input id="chat-input" placeholder="问点什么,例如:总结这个页面" enterkeyhint="send" autocomplete="off">
    <button id="chat-send" class="primary">发送</button>
  </div>
  <div class="row tools-row">
    <button id="chat-reset">清空对话</button>
    <button id="read">自检</button>
    <button id="reconnect">重连</button>
    <button id="unpair" style="margin-left:auto">断开</button>
  </div>
  <pre id="out"></pre>

  <p class="hint">与 <b>hmh CLI 智能体</b>对话;它可经 <b class="mono">page_read / page_act</b> 读取并操作你当前的标签页(操作当着你的面执行)。
  桥未运行时每 30 秒自动重试,终端执行 <b class="mono">hmh extension start</b> 即连。</p>

  <script src="ui.js"></script>
</body>
</html>
