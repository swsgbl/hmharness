name: publish
on:
  workflow_dispatch:
  push:
    tags: ['v*']

# npm release without ever putting the token in chat/logs: the credential
# lives as the NPM_TOKEN repo secret (GitHub -> Settings -> Secrets ->
# Actions). Run this workflow manually, or push a v* tag; publish.cjs runs
# its own preflight (typecheck + tests + build + pack) before any publish.
# windows-latest: publish.cjs's whoami check shells through cmd.exe and the
# project is Windows-first (hdc/hvigor toolchain assumptions).
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: install
        run: npm install
      # 2026-10-26 修复:CI 从 0.23.33 起 publish 全 failure——checkout 无构建
      # 产物,preflight 的 shipped-impl 检查(web/cli dist)必挂。build 产出
      # dist(拓扑序+fix-dts)。另:全新环境首跑偶发 agent 撞 fix-dts 重写
      # kernel 声明的竞态(单包重跑即过,复现实证)——失败重试一次。
      - name: build
        id: build_first
        continue-on-error: true
        run: npm run build
      - name: build retry (fresh-env race)
        if: steps.build_first.outcome == 'failure'
        run: |
          Start-Sleep -Seconds 10
          npm run build
      - name: 'publish (ordered set, kernel through cli + codexhost-bridge)'
        run: node scripts/publish.cjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
