name: publish
on:
  workflow_dispatch:
  push:
    tags: ['v*']

# npm release without ever putting the token in chat/logs: the credential
# lives as the NPM_TOKEN repo secret (GitHub -> Settings -> Secrets ->
# Actions). Run this workflow manually, or push a v* tag; publish.cjs runs
# its own preflight (typecheck + tests + build + pack) before any publish.
# windows-latest: publish.cjs's whoami check shells through cmd.exe and the
# project is Windows-first (hdc/hvigor toolchain assumptions).
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: install
        run: npm install
      # 2026-10-26 根修:全新 install 时 npm 会给子包装"嵌套实体 @hmharness/*"
      # (registry 旧版,如 agent 下 kernel@0.23.39 无 signal 字段)遮蔽根
      # workspace 链接 → tsc 读到过时声明(0.23.33 起所有 CI failure 的真根因;
      # traceResolution 实证解析到 packages/agent/node_modules/...)。
      # 清掉嵌套副本,让解析回退到根 junction(本地开发一直如此,故从未触发)。
      - name: purge nested @hmharness copies (restore workspace links)
        run: |
          Get-ChildItem -Path packages -Directory | ForEach-Object {
            $nested = Join-Path $_.FullName 'node_modules/@hmharness'
            if (Test-Path $nested) {
              Write-Host "purging $nested"
              Remove-Item -Recurse -Force $nested
            }
          }
      # 2026-10-26 修复:CI 从 0.23.33 起 publish 全 failure——checkout 无构建
      # 产物,preflight 的 shipped-impl 检查(web/cli dist)必挂。build 产出
      # dist(拓扑序+fix-dts)。另:全新环境首跑偶发 agent 撞 fix-dts 重写
      # kernel 声明的竞态(单包重跑即过,复现实证)——失败重试一次。
      - name: build
        id: build_first
        continue-on-error: true
        run: npm run build
      # 挂点恒在 agent(全新环境首跑的声明解析时序;单包续跑实证必过,
      # 前序包 dist 已建好——从挂点续跑,不动生产 build 链)
      - name: build resume from failure point
        if: steps.build_first.outcome == 'failure'
        run: |
          npm run build -w @hmharness/agent
          node scripts/fix-dts.mjs
          npm run build -w @hmharness/web
          node scripts/fix-dts.mjs
          npm run build -w @hmharness/cli
          node scripts/fix-dts.mjs
      - name: 'publish (ordered set, kernel through cli + codexhost-bridge)'
        run: node scripts/publish.cjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
