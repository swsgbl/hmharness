name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - name: unit tests
        run: npm test
      - run: npm run build
      - name: built CLI smoke (no model needed)
        run: node packages/cli/dist/main.js skills
